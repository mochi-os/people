# nl-be overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through nl-be, then nl, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 43 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
notifications.topic.invite.received = Vrienduitnodigingen
notifications.topic.accept.accepted = Vriendverzoeken geaccepteerd
notifications.title.friend_request_accepted = Vriendschapsverzoek aanvaard
notifications.body.accepted_invitation = {name} heeft je vriendschapsuitnodiging aanvaard
errors.name_cannot_be_empty = Naam kan niet leeg zijn
